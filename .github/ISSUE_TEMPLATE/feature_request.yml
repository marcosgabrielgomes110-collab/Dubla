name: Feature request
description: Suggest an improvement or a new engine/feature.
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or inconvenient today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How should it work (UI, API, config or pipeline)?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Pipeline / mux
        - Speech-to-text
        - Translation
        - Voice generation
        - API
        - Frontend
        - Documentation
        - Tooling
    validations:
      required: true
