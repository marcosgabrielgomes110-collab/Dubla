name: Bug report
description: Report something that is broken in Dubla.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste API keys or private media. Use `python -m src.Dubla_Api` / `make logs` output when possible.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. make up
        2. open /pipeline with URL ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Paste the relevant lines from .run/api.log or Data/logs.
      render: text

  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: "git rev-parse --short HEAD"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Pipeline / mux
        - Speech-to-text
        - Translation
        - Voice generation
        - API
        - Frontend
        - Documentation
        - Other
    validations:
      required: true
